<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Web Móvil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #24292e;
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
        }

        main {
            flex: 1;
            padding: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background-color: #2ea44f;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 1rem;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            color: #666;
            background-color: #e1e4e8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Sitio Móvil</h1>
    </header>

    <main>
        <div class="card">
            <h2>¡Hola!</h2>
            <p>Esta es una página optimizada para pantallas táctiles y dispositivos móviles.</p>
            <a href="#" class="btn">Botón de Acción</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Publicado con GitHub Pages</p>
    </footer>

</body>
</html>
